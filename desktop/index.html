<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertex</title>
  <link rel="stylesheet" href="review.css">
  <script defer src="review.js"></script>
</head>
<body>
  <header>
    <div><h1>Workspace review</h1><p id="workspace">Choose a trusted Git repository to inspect local changes.</p></div>
    <div class="actions"><button id="open">Open folder</button><button id="refresh" disabled>Refresh</button></div>
  </header>
  <main>
    <section>
      <h2>DeepSeek coding</h2>
      <form id="coding" autocomplete="off">
        <label>API key <input id="api-key" type="password" required maxlength="512" autocomplete="off"></label>
        <label>Model <select id="model"><option value="deepseek-flash">Flash</option><option value="deepseek-v4-pro">Pro</option></select></label>
        <label>Task <textarea id="task" rows="2" required maxlength="4000"></textarea></label>
        <label>Source code and file paths <textarea id="context" rows="6" required maxlength="32000"></textarea></label>
        <p>The task and pasted code are sent to DeepSeek and may incur API charges. Keep secrets out of the source context.</p>
        <button id="propose">Send to DeepSeek and propose patch</button>
      </form>
      <p id="coding-feedback" role="status"></p>
      <pre id="proposal" hidden></pre>
    </section>
    <p id="feedback" role="status"></p>
    <section id="results" hidden>
      <h2>Status</h2><pre id="status"></pre>
      <h2>Staged changes</h2><pre id="staged"></pre>
      <h2>Unstaged changes</h2><pre id="unstaged"></pre>
    </section>
  </main>
</body>
</html>
