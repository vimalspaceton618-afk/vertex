name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const a = require(process.env.RUNNER_TEMP + "/npm-audit.json"); console.log(JSON.stringify({metadata: a.metadata?.vulnerabilities, vulnerabilities: Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({name, severity: v.severity, isDirect: v.isDirect, via: (v.via || []).map(x => typeof x === "string" ? x : x.name), fixAvailable: v.fixAvailable}))}, null, 2))'
      - name: Build and test
        run: npm test
      - name: Verify npm CLI package contents
        shell: bash
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/npm-pack.json"
          node -e 'const p = JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/npm-pack.json", "utf8"))[0]; const files = new Set((p.files || []).map(f => f.path)); const required = ["package.json", "README.md", "dist/cli.js"]; const missing = required.filter(f => !files.has(f)); if (missing.length) { console.error("CLI package is missing required files:", missing); process.exit(1); } console.log("npm package entrypoint verified:", p.name, p.version, "with", files.size, "files");'
      - name: Fail on high or critical dependency advisories
        shell: bash
        run: |
          node -e 'const a = require(process.env.RUNNER_TEMP + "/npm-audit.json"); const v = a.metadata?.vulnerabilities || {}; console.log("Dependency security gate:", JSON.stringify(v)); if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exit(1)'

  windows-build-and-test:
    name: Windows Node 24 build and test
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and build
        run: npm ci
      - name: Run full regression suite on Windows
        run: npm test

  global-install-smoke:
    name: Global install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and build
        run: npm ci
      - name: Pack and install VERTEX globally
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm pack --json --ignore-scripts > pack.json
          PACKAGE_FILE="$(node -e 'const p = JSON.parse(require("node:fs").readFileSync("pack.json", "utf8"))[0]; process.stdout.write(p.filename)')"
          if [ -z "$PACKAGE_FILE" ] || [ ! -f "$PACKAGE_FILE" ]; then
            echo "npm pack did not produce the expected tarball" >&2
            exit 1
          fi
          npm install --global "./$PACKAGE_FILE"
          vertex --version
